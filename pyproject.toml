[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project]
name = "geoctl"
version = "0.1.0"
description = "Audit whether AI systems can reach, read, and answer questions from your website"
readme = "README.md"
authors = [
    { name = "Aman Kushwaha", email = "70597017+Amank-root@users.noreply.github.com" }
]
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "geo",
    "aeo",
    "generative-engine-optimization",
    "llm",
    "seo",
    "crawler",
    "cli",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "extruct>=0.14",
    "protego>=0.3",
    "diskcache>=5.6",
    "litellm>=1.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1.370",
    "pre-commit>=3.8",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
]

[project.scripts]
geoctl = "geoctl.cli:main"

[project.urls]
Homepage = "https://github.com/Amank-root/GeoProbe"
Documentation = "https://github.com/Amank-root/GeoProbe/tree/main/docs"
Issues = "https://github.com/Amank-root/GeoProbe/issues"

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1.370",
    "pre-commit>=3.8",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # Typer relies on calls in argument defaults
    "SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = true
# Optional extras (playwright) and heavyweight third-party stubs are not installed
# in every environment; a missing import must not fail the type check.
reportAttributeAccessIssue = false