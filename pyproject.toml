[project]
name = "geoprobe"
version = "0.1.0"
description = "Audit whether AI systems can reach, read, and answer questions from your website"
readme = "README.md"
authors = [
    { name = "Aman Kushwaha", email = "70597017+Amank-root@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["geo", "aeo", "llm", "seo", "crawler", "cli", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "extruct>=0.14",
    "protego>=0.3",
    "diskcache>=5.6",
    "litellm>=1.50",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1.370",
    "pre-commit>=3.8",
    "hypothesis>=6.100",
]

[project.scripts]
geoprobe = "geoprobe.cli:main"

[project.urls]
Homepage = "https://github.com/Amank-root/geoprobe"
Documentation = "https://github.com/Amank-root/geoprobe/tree/main/docs"
Issues = "https://github.com/Amank-root/geoprobe/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
